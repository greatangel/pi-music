version: '3.8'

services:
  lunafm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pimusic
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - TZ=America/Monterrey
    # Optional: limit resources for Pi
    #deploy:
      #resources:
        #limits:
          #memory: 512M
          #cpus: '0.5'
        #reservations:
          #memory: 128M
          #cpus: '0.1'
    # Optional: mount for logs if you want persistence
    # volumes:
    #   - ./logs:/app/logs
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import discord; print('OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: pimusic-network